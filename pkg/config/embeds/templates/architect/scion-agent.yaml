schema_version: "1"
description: "Software architect — designs systems, reviews architecture, plans implementations"
agent_instructions: agents.md
system_prompt: system-prompt.md
env:
  SCION_ROLE: architect
# Grant orchestration scopes so the architect can spawn sub-agents
# (implementers, reviewers) and manage their lifecycle.
hub_access_scopes:
  - "grove:agent:create"
  - "grove:agent:lifecycle"
  - "grove:agent:notify"
